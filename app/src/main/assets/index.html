<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chess Master</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2935;--gold:#e5b85c;--muted:#9eb0bf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fa;font:16px system-ui, sans-serif;padding:18px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}h1{font-size:25px;margin:0}header span{color:var(--gold)}
p{color:var(--muted);margin:5px 0 16px}.panel{background:var(--panel);border:1px solid #304252;border-radius:16px;padding:14px;margin:12px 0}
input,textarea,button{font:inherit;border-radius:10px}textarea,input{width:100%;background:#0d151c;color:white;border:1px solid #405362;padding:12px;margin:6px 0}
textarea{min-height:120px;resize:vertical}button{background:var(--gold);color:#18212a;border:0;padding:11px 14px;font-weight:700;margin:4px 3px 4px 0}button.secondary{background:#334656;color:#fff}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;max-width:440px;margin:10px auto;aspect-ratio:1;border:4px solid #b38a4d;border-radius:5px;overflow:hidden}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(25px,8vw,43px);line-height:1;user-select:none}
.light{background:#f0d9b5}.dark{background:#b58863}.sq.selected{outline:4px solid #e7c34f;outline-offset:-4px}
#moves{line-height:1.9;max-height:150px;overflow:auto;color:#dbe5ec}.move{display:inline-block;padding:0 5px;border-radius:5px}.active{background:var(--gold);color:#17212a}
.stat{font-size:22px;font-weight:700;color:var(--gold)}small{color:var(--muted)}
</style>
</head>
<body>
<header><div style="font-size:32px">♟️</div><div><h1>Chess <span>Master</span></h1><small>Game viewer · PGN import</small></div></header>
<p>Paste a game's PGN below to replay it on the board.</p>
<section class="panel">
<label for="pgn">Paste PGN</label>
<textarea id="pgn" placeholder='[Event "Casual Game"]&#10;1. e4 e5 2. Nf3 Nc6 ...'></textarea>
<button id="load">Load game</button>
<button class="secondary" id="sample">Try sample</button>
<input id="file" type="file" accept=".pgn,.txt">
</section>
<section class="panel">
<div id="board" aria-label="Chess board"></div>
<div style="text-align:center">
<button class="secondary" id="start">|◀</button><button class="secondary" id="prev">◀</button><button class="secondary" id="next">▶</button><button class="secondary" id="end">▶|</button>
</div>
<div id="position" style="text-align:center;margin:8px;color:var(--muted)">No game loaded</div>
<div id="moves"></div>
</section>
<section class="panel">
<div>Material balance</div><div class="stat" id="eval">—</div>
<small>This is a material count only, not a Stockfish engine evaluation. Full engine analysis is not included in this first build.</small>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const glyph={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const game=new Chess();let history=[],index=0;
const board=document.getElementById('board');
function render(){
 const b=game.board();board.innerHTML='';
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const el=document.createElement('div');el.className='sq '+((r+c)%2?'dark':'light');const p=b[r][c];if(p)el.textContent=glyph[p.color==='w'?p.type.toUpperCase():p.type];board.appendChild(el)}
 document.getElementById('position').textContent=history.length?('Move '+index+' of '+history.length+' · '+(game.turn()==='w'?'White':'Black')+' to move'):'No game loaded';
 const vals={p:1,n:3,b:3,r:5,q:9,k:0};let score=0;b.flat().forEach(p=>{if(p)score+=(p.color==='w'?1:-1)*vals[p.type]});
 document.getElementById('eval').textContent=(score>0?'+':'')+score+' pawns (material)';
 document.querySelectorAll('.move').forEach((e,i)=>e.classList.toggle('active',i===index-1));
}
function go(n){index=Math.max(0,Math.min(history.length,n));game.reset();for(let i=0;i<index;i++)game.move(history[i]);render()}
function loadPgn(t){game.reset();if(!game.load_pgn(t)){alert('Could not read this PGN. Please check the text and try again.');return}history=game.history();go(history.length);const out=document.getElementById('moves');out.innerHTML='';history.forEach((m,i)=>{const e=document.createElement('span');e.className='move';e.textContent=(i%2===0?(Math.floor(i/2)+1)+'. ':'')+m;out.appendChild(e);out.append(' ')});}
document.getElementById('load').onclick=()=>loadPgn(document.getElementById('pgn').value);
document.getElementById('sample').onclick=()=>{const s='1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6 5. O-O Be7 6. Re1 b5 7. Bb3 d6';document.getElementById('pgn').value=s;loadPgn(s)};
document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);document.getElementById('start').onclick=()=>go(0);document.getElementById('end').onclick=()=>go(history.length);
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{document.getElementById('pgn').value=r.result;loadPgn(r.result)};r.readAsText(f)}};
render();
</script>
</body></html>
