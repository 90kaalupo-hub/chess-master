plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chessmaster.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chessmaster.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3.2'
    }

    sourceSets {
        main {
            // Bundle the complete website, including chess rules, Stockfish JS/WASM,
            // offline page, service worker, manifest and third-party notices.
            assets.srcDirs = ["src/main/assets", "$rootDir/website"]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
